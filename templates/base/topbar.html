<header class="sp-topbar d-flex align-items-center px-3">
  <button class="sp-hamburger d-lg-none" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#spSidebar" aria-controls="spSidebar">
    <i class="bi bi-list fs-4"></i>
  </button>

  <span class="sp-topbar-mobile-brand d-lg-none ms-2">Sajilo Pasal</span>

  <div class="sp-search d-none d-lg-flex ms-3">
    <i class="bi bi-search"></i>
    <span class="flex-grow-1">Search anything...</span>
    <kbd>Ctrl /</kbd>
  </div>

  <div class="d-flex align-items-center gap-3 ms-auto">
    <a href="#" class="sp-bell" title="Notifications">
      <i class="bi bi-bell fs-5"></i>
      <span class="sp-bell-badge">3</span>
    </a>
    <div class="dropdown">
      <button class="btn d-flex align-items-center gap-2 dropdown-toggle" type="button" data-bs-toggle="dropdown">
        <span class="sp-avatar">{{ request.user.short_name|slice:":1"|upper }}</span>
        <span class="sp-avatar-name d-none d-lg-block">
          <div class="name">{{ request.user.short_name }}</div>
          <div class="role">Owner</div>
        </span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person-circle me-2"></i>Profile</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
